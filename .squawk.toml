# Squawk lints migrations for changes that lock or break a live database.
# Supabase CLI runs each migration file in a transaction.
assume_in_transaction = true
pg_version = "17.0"
excluded_rules = [
  # Generated by drizzle-kit; each file runs once inside a transaction, so partial reruns don't happen.
  "prefer-robust-stmts",
  # Row positions within one conversation; int is plenty.
  "prefer-bigint-over-int",
  # Every table so far is new and empty. Revisit before the first ALTER on a table with real data.
  "require-lock-timeout",
  "require-statement-timeout",
]
